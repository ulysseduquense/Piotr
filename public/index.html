<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piotr – Petits travaux</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/fr.global.min.js"></script>
</head>
<body>
<header>
  <h1>🛠️ Piotr – Petits travaux</h1>
  <nav id="nav" hidden>
    <button data-view="calendar">Calendrier</button>
    <button data-view="bookings">Mes demandes</button>
    <button data-view="admin" class="admin-only">Gestion</button>
    <span id="who"></span>
    <button id="logout" class="secondary">Déconnexion</button>
  </nav>
</header>
<main>
  <section id="auth" hidden>
    <div class="card narrow">
      <h2 id="authTitle">Connexion</h2>
      <form id="authForm">
        <label class="reg">Nom <input name="name"></label>
        <label class="reg">Téléphone <input name="phone"></label>
        <label>E-mail <input name="email" type="email" required></label>
        <label>Mot de passe <input name="password" type="password" required minlength="6"></label>
        <button type="submit" id="authSubmit">Se connecter</button>
        <p class="error" id="authError"></p>
      </form>
      <p><a href="#" id="authToggle">Pas encore de compte ? Créer un compte</a></p>
    </div>
  </section>

  <section id="calendar" hidden>
    <p class="hint" id="calHint"></p>
    <div class="legend">
      <span class="dot unavailable"></span>Indisponible
      <span class="dot busy"></span>Occupé
      <span class="dot pending"></span>En attente
      <span class="dot confirmed"></span>Confirmé
    </div>
    <div class="card"><div id="cal"></div></div>
  </section>

  <section id="bookings" hidden>
    <div id="bookingList"></div>
  </section>

  <section id="admin" hidden>
    <div class="card">
      <h2>Tarif horaire par défaut</h2>
      <form id="rateForm" class="row">
        <input name="default_rate" type="number" step="0.01" min="0"> € / h
        <button>Enregistrer</button>
      </form>
      <p class="hint">Appliqué aux nouvelles demandes. Modifiable ensuite pour chaque intervention.</p>
    </div>
    <div class="card">
      <h2>Clients</h2>
      <div id="clientList"></div>
    </div>
  </section>
</main>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
